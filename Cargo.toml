[workspace]
members = ["contracts", "indexer", "wasm-sdk", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["DagLock contributors"]
rust-version = "1.85.0"

[workspace.dependencies]
# Kaspa / SilverScript deps (branch: tn12)
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "ab4c51af" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "ab4c51af" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "ab4c51af" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "ab4c51af" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "ab4c51af" }
kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "ab4c51af" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "ab4c51af" }

# Indexer deps
tokio = { version = "1", features = ["full"] }
axum = "0.7"
sqlx = { version = "0.7", features = [
  "postgres",
  "runtime-tokio-native-tls",
  "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
blake2b_simd = "1.0"
hex = "0.4"

# WASM deps
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
getrandom = { version = "0.2", features = ["js"] }

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
