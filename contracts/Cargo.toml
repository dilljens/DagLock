[package]
name = "daglock-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
silverscript-lang = { git = "https://github.com/kaspanet/silverscript", branch = "master" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "ab4c51af" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "ab4c51af" }
blake2b_simd = "1.0"

[dev-dependencies]
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "ab4c51af" }
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
rand = "0.8"
sha2 = "0.10"
