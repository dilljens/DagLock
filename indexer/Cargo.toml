[package]
name = "daglock-indexer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
postgres = []

[dependencies]
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap.workspace = true
prometheus.workspace = true
blake2b_simd.workspace = true
sha2 = "0.10"

sqlx = { version = "0.7", features = [
  "sqlite",
  "postgres",
  # The postgres cfg warning is expected — the feature is available but not default.
  # Enable it with --features postgres when using PostgreSQL.
  "runtime-tokio-native-tls",
  "migrate",
] }

kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }

daglock-contracts = { path = "../contracts" }
daglock-shared = { path = "../shared" }
futures = "0.3"
async-trait = "0.1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"

kaspa-notify = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }

secp256k1 = { version = "0.29", features = ["global-context"] }
once_cell = "1.21.4"
lettre = { version = "0.11", features = ["builder", "smtp-transport", "tokio1-rustls-tls", "tokio1"], default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
axum-test = "16"
tokio-tungstenite = "0.21"
futures-util = "0.3"
insta = { version = "1", features = ["json", "redactions"] }
proptest = "1"
proptest-state-machine = "0.1"
