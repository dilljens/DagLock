# DagLock Nginx Configuration
# Rate limiting + HTTPS + reverse proxy

# Rate limit zone: 10 requests/second per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Global limits
client_max_body_size 1m;

server {
    listen 80;
    server_name api.daglock.io;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.daglock.io;
    client_max_body_size 1m;

    # SSL (use Let's Encrypt or your certs)
    ssl_certificate /etc/letsencrypt/live/api.daglock.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.daglock.io/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API endpoints - rate limited
    location /v1/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Health check - no rate limit
    location /v1/health {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Web UI
server {
    listen 443 ssl http2;
    server_name daglock.io www.daglock.io;

    ssl_certificate /etc/letsencrypt/live/daglock.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daglock.io/privkey.pem;

    root /var/www/daglock.io;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to indexer
    location /api/ {
        rewrite ^/api/(.*) /v1/$1 break;
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
